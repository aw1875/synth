name: Dev Release
on:
  workflow_run:
    workflows: [Run Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synth-release
  cancel-in-progress: false

jobs:
  dev:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Build and Publish
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Work out what is being released
        id: vars
        run: |
          set -euo pipefail

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build every target
        run: zig build release

      - name: Package the distributed targets
        run: ./.github/scripts/package.sh dev

      - name: Point the dev tag at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f dev "${{ steps.vars.outputs.sha }}"
          git push --force origin dev

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          name: synth dev (${{ steps.vars.outputs.short }})
          tag_name: dev
          prerelease: true
          make_latest: false
          draft: false
          fail_on_unmatched_files: true
          body: |
            The latest build of `master`, replaced on every green run. Not a supported release: use it to try something before it ships.

            **Build ${{ steps.vars.outputs.build }}** from ${{ steps.vars.outputs.short }}
          token: ${{ secrets.GITHUB_TOKEN }}
