name: Dev Release
on:
  workflow_run:
    workflows: [Run Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synth-release
  cancel-in-progress: false

jobs:
  dev:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Build and Publish
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Work out what is being released
        id: vars
        run: |
          set -euo pipefail

          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          build=$(git rev-list --count HEAD)
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)

          if [ -n "$previous" ]; then
            span="${previous}..HEAD"
            heading="Since $previous"
            compare="**Full diff:** [\`${previous}...${short}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${previous}...${sha})"
          else
            span="HEAD"
            heading="Since the beginning"
            compare=""
          fi

          total=$(git rev-list --count --no-merges "$span")
          commits=$(git log --reverse --no-merges --pretty=format:'- %s (`%h`)' "$span" | head -n 200)
          if [ "$total" -gt 200 ]; then
            commits="${commits}"$'\n'"- ... and $((total - 200)) more"
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "heading=$heading" >> "$GITHUB_OUTPUT"
          {
            echo "compare<<SYNTH_EOF"
            echo "$compare"
            echo "SYNTH_EOF"
            echo "commits<<SYNTH_EOF"
            echo "$commits"
            echo "SYNTH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build every target
        run: zig build release

      - name: Package the distributed targets
        id: package
        run: ./.github/scripts/package.sh dev

      - name: Point the dev tag at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git tag -f dev "${{ steps.vars.outputs.sha }}"
          git push --force origin dev

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          name: synth dev (${{ steps.vars.outputs.short }})
          tag_name: dev
          prerelease: true
          make_latest: false
          draft: false
          fail_on_unmatched_files: true
          body: |
            The latest build of `master`, replaced on every green run. Not a
            supported release: use it to try something before it ships.

            **Build ${{ steps.vars.outputs.build }}** from
            [`${{ steps.vars.outputs.short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.vars.outputs.sha }})

            ## ${{ steps.vars.outputs.heading }}

            ${{ steps.vars.outputs.commits }}

            ${{ steps.vars.outputs.compare }}

            ## Install

            ```sh
            tar -xzf synth-dev-<target>.tar.gz
            install -m755 synth /usr/local/bin/synth
            ```

            ## SHA256 Checksums

            ```
            ${{ steps.package.outputs.checksums }}
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
