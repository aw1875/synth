name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

concurrency:
  group: synth-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build and Publish
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run Tests
        run: zig build test

      - name: Work out what is being released
        id: vars
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # A release whose --version disagrees with its tag is a bug.
          declared=$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ "$declared" != "$version" ]; then
            echo "::error::tag $tag wants version $version, build.zig.zon says $declared"
            exit 1
          fi

          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${tag}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            span="${previous}..${tag}"
            from=$(git rev-parse --short "$previous")
          else
            span="$tag"
            from=$(git rev-parse --short "$(git rev-list --max-parents=0 "$tag" | tail -1)")
          fi

          commits=$(git log --no-merges -n 20 --pretty=format:'- %s (%h)' "$span")
          range="Full history: ${from}...$(git rev-parse --short "$tag")"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          {
            echo "commits<<SYNTH_EOF"
            echo "$commits"
            echo "SYNTH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build every target
        run: zig build release

      - name: Package the distributed targets
        run: ./.github/scripts/package.sh "${{ steps.vars.outputs.version }}"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          name: synth v${{ steps.vars.outputs.version }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          draft: false
          fail_on_unmatched_files: true
          overwrite_files: false
          body: |
            ## Changes

            ${{ steps.vars.outputs.commits }}

            ${{ steps.vars.outputs.range }}

            ## Install

            ```sh
            tar -xzf synth-${{ steps.vars.outputs.version }}-<target>.tar.gz
            install -m755 synth /usr/local/bin/synth
            ```
          token: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: Propose Homebrew update
    needs: release
    if: github.repository == 'aw1875/synth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out master
        uses: actions/checkout@v7
        with:
          ref: refs/heads/master
          fetch-depth: 0

      - name: Open Homebrew update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          branch="chore/update-homebrew-$tag"
          formula="Formula/synth.rb"
          archives=$(mktemp -d)

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$archives" \
            --pattern "synth-$version-aarch64-macos.tar.gz" \
            --pattern "synth-$version-x86_64-linux-musl.tar.gz"
          python3 .github/scripts/update-homebrew.py "$version" --archives "$archives"
          if git diff --quiet -- "$formula"; then
            exit 0
          fi

          existing_branch=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$existing_branch" ]; then
            git fetch origin "refs/heads/$branch"
            if [ "$(git diff --name-only HEAD...FETCH_HEAD)" != "$formula" ] ||
              ! git show "FETCH_HEAD:$formula" | cmp -s - "$formula"; then
              echo "::error::$branch already exists with different changes"
              exit 1
            fi
          else
            git switch -c "$branch"
            git add -- "$formula"
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(homebrew): update synth to $version"
            git push origin "HEAD:refs/heads/$branch"
          fi

          pr=$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f base=master -f "head=$GITHUB_REPOSITORY_OWNER:$branch" -f state=open \
            --jq '.[0].html_url // empty')
          if [ -n "$pr" ]; then
            echo "$pr"
            exit 0
          fi

          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" \
            --title "chore(homebrew): update synth to $version" --body-file - <<EOF
          Update the Homebrew formula to [$tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag).
          The SHA-256 checksums come from the published macOS arm64 and Linux x86-64 archives.
          EOF
