name: Release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+

permissions:
  contents: read

concurrency:
  group: synth-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    name: Build and Publish
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run Tests
        run: zig build test

      - name: Work out what is being released
        id: vars
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # A release whose --version disagrees with its tag is a bug.
          declared=$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",$/\1/p' build.zig.zon)
          if [ "$declared" != "$version" ]; then
            echo "::error::tag $tag wants version $version, build.zig.zon says $declared"
            exit 1
          fi

          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${tag}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            span="${previous}..${tag}"
            from=$(git rev-parse --short "$previous")
          else
            span="$tag"
            from=$(git rev-parse --short "$(git rev-list --max-parents=0 "$tag" | tail -1)")
          fi

          total=$(git rev-list --count --no-merges "$span")
          commits=$(git log --no-merges --pretty=format:'- %s (%h)' "$span" | head -n 20)
          range="Full history: ${from}...$(git rev-parse --short "$tag")"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "range=$range" >> "$GITHUB_OUTPUT"
          {
            echo "commits<<SYNTH_EOF"
            echo "$commits"
            echo "SYNTH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build every target
        run: zig build release

      - name: Package the distributed targets
        run: ./.github/scripts/package.sh "${{ steps.vars.outputs.version }}"

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          name: synth v${{ steps.vars.outputs.version }}
          tag_name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          draft: false
          fail_on_unmatched_files: true
          body: |
            ## Changes

            ${{ steps.vars.outputs.commits }}

            ${{ steps.vars.outputs.range }}

            ## Install

            ```sh
            tar -xzf synth-${{ steps.vars.outputs.version }}-<target>.tar.gz
            install -m755 synth /usr/local/bin/synth
            ```
          token: ${{ secrets.GITHUB_TOKEN }}
