name: Run Tests
on:
  push:
    branches: [master]
    paths: &zig
      - "**.zig"
      - "**.zig.zon"
      - "src/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [master]
    paths: *zig

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Build and Test
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run Tests
        run: zig build test

  desktop:
    runs-on: macos-26
    name: Build and Test macOS App
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Lint Swift
        working-directory: desktop
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint lint --strict

      - name: Build App
        run: desktop/Scripts/build-app.sh

      - name: Test with Bundled Engine
        run: python3 desktop/Tests/Fixtures/fake_provider.py desktop/DerivedData/Build/Products/Release/Synth.app/Contents/Helpers/synth
